<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Group 4 Project</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app" id="app">

  <aside class="sidebar">
    <div class="brand"><span class="logo">✎</span> <span class="brand-name">Group 4 Project</span></div>
    <button class="btn primary block" id="newBtn">＋ New note <kbd>Alt+N</kbd></button>

    <nav class="nav" id="nav">
      <button data-view="active" class="active">📝 Notes <span class="count" id="c-active">0</span></button>
      <button data-view="archived">📦 Archive <span class="count" id="c-archived">0</span></button>
      <button data-view="trash">🗑 Trash <span class="count" id="c-trash">0</span></button>
    </nav>

    <div class="side-title">Tags</div>
    <div class="tags" id="tagList"></div>

    <div class="side-foot">
      <button class="btn ghost" id="statsBtn">📊 Stats</button>
      <button class="btn ghost" id="exportBtn">⬇ Export</button>
      <button class="btn ghost" id="importBtn">⬆ Import</button>
      <button class="btn ghost" id="themeBtn">🌓 Theme</button>
      <input type="file" id="importFile" accept="application/json" hidden>
    </div>
  </aside>

  <section class="list-pane">
    <div class="list-head">
      <input id="search" type="search" placeholder="Search notes…  (Ctrl+K)">
      <div class="list-tools">
        <select id="sort" title="Sort">
          <option value="updated">Last edited</option>
          <option value="created">Newest</option>
          <option value="title">Title A–Z</option>
          <option value="words">Longest</option>
        </select>
        <button class="btn small danger hidden" id="emptyTrash">Empty trash</button>
      </div>
      <div class="swatches filter" id="colorFilter" title="Filter by colour"></div>
    </div>
    <div class="list" id="list"></div>
  </section>

  <main class="editor-pane">
    <div class="empty" id="empty">
      <div class="big">📓</div>
      <p>Select a note or create a new one.</p>
    </div>

    <div class="editor hidden" id="editor">
      <div class="ed-top">
        <button class="btn ghost back" id="backBtn">← Back</button>
        <input id="title" class="title" placeholder="Title" maxlength="200">
        <div class="actions">
          <button class="icon" id="pinBtn" title="Pin">📌</button>
          <button class="icon" id="archiveBtn" title="Archive">📦</button>
          <button class="icon" id="historyBtn" title="Version history">🕘</button>
          <button class="icon" id="dupBtn" title="Duplicate">⧉</button>
          <button class="icon" id="mdBtn" title="Download as .md">⬇</button>
          <button class="icon" id="delBtn" title="Delete">🗑</button>
          <button class="btn small" id="restoreBtn">Restore</button>
        </div>
      </div>

      <div class="ed-meta">
        <div class="chips" id="chips"><input id="tagInput" placeholder="Add tag + Enter" maxlength="30"></div>
        <div class="swatches" id="colors"></div>
      </div>

      <div class="ed-bar">
        <div class="seg" id="modes">
          <button data-mode="edit">Edit</button>
          <button data-mode="split" class="active">Split</button>
          <button data-mode="preview">Preview</button>
        </div>
        <div class="fmt" id="fmt">
          <button data-f="**" title="Bold"><b>B</b></button>
          <button data-f="*" title="Italic"><i>I</i></button>
          <button data-f="`" title="Code">&lt;/&gt;</button>
          <button data-f="# " title="Heading">H</button>
          <button data-f="- " title="List">•</button>
          <button data-f="- [ ] " title="Checklist">☑</button>
          <button data-f="> " title="Quote">❝</button>
        </div>
        <div class="status" id="status"></div>
      </div>

      <div class="ed-body split" id="edBody">
        <textarea id="content" placeholder="Write something… Markdown is supported."></textarea>
        <div class="preview" id="preview"></div>
      </div>

      <div class="ed-foot" id="edFoot"></div>
    </div>
  </main>
</div>

<div class="modal-back hidden" id="modalBack">
  <div class="modal">
    <div class="modal-head"><h3 id="modalTitle"></h3><button class="icon" id="modalClose">✕</button></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>
<div class="toasts" id="toasts"></div>

<script src="/app.js"></script>
<script>
  if (location.protocol === 'file:') {
    document.addEventListener('DOMContentLoaded', function () {
      document.body.innerHTML = '<div style="max-width:560px;margin:15vh auto;font:16px/1.6 system-ui;padding:0 20px"><h2>Start the server first</h2><p>You opened <code>index.html</code> directly, so the app cannot reach its API.</p><ol><li>Open a terminal in the <b>notes-app</b> folder</li><li>Run <code>node server.js</code></li><li>Go to <b>http://localhost:3000</b> in your browser</li></ol></div>';
    });
  }
</script>
</body>
</html>
